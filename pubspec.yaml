name: portofolio
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  # FIX: Indentasi digeser masuk 2 spasi biar sejajar & kedaftar rapi sebagai dependency blay!
  visibility_detector: ^0.4.0+2
  google_fonts: ^6.3.0
  flutter_animate: ^4.5.2
  font_awesome_flutter: ^10.10.0
  url_launcher: ^6.3.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/profile/
    - assets/images/icon/
    - assets/images/sertifikat/


  # FIX: Indentasi fonts digeser masuk ke dalam scope 'flutter:' biar dibaca framework!
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500

        - asset: assets/fonts/Inter_24pt-Bold.ttf
          weight: 700